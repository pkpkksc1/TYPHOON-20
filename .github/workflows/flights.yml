name: Flight Status Update v8.69.1

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 06:00 실행
    # GitHub Actions cron UTC 기준
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: daily-flight-status
  cancel-in-progress: false


jobs:

  fetch-flight-status:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # requirements.txt 없음 - 설치 단계 제거


      # Aviationstack flight status
      - name: Fetch flight status
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}

        run: |
          python src/fetch_flights.py


      # FlightAware API 승인 대기 중
      - name: Fetch FlightAware status (Disabled)
        run: |
          echo "FlightAware API pending approval - skipped"


      # dashboard 재생성
      - name: Build dashboard data
        run: |
          python src/build_dashboard.py


      # 데이터 확인
      - name: Check updated data
        run: |
          echo "===== Flight Data ====="
          cat data/flights.json

          echo "===== Dashboard Data ====="
          cat data/dashboard.json


      # 저장
      - name: Commit updated data

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add data/flights.json
          git add data/dashboard.json


          git diff --cached --quiet || git commit -m "Update flight dashboard v8.69.1"


          git push
