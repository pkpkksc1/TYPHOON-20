name: Typhoon Impact

on:
  workflow_dispatch: {}
  schedule:
    - cron: "22,52 * * * *"

permissions:
  contents: write

concurrency:
  group: typhoon-impact
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate logistics impact
        run: python src/typhoon_impact.py

      - name: Commit changed impact
        shell: bash
        run: |
          if [ ! -f data/typhoon_impact.json ]; then
            echo "data/typhoon_impact.json was not created."
            exit 1
          fi

          git add data/typhoon_impact.json

          if git diff --cached --quiet; then
            echo "No impact data change. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update typhoon logistics impact"
          git push
