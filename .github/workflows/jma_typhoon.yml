name: JMA Typhoon Fetch

on:
  workflow_dispatch:
  schedule:
    # 30분마다 실행
    # GitHub Actions cron은 UTC 기준
    # 중국시간에서도 매시간 xx:07 / xx:37에 실행
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: jma-typhoon-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JMA typhoon data
        run: python src/fetch_jma_typhoon.py

      - name: Rebuild dashboard with latest JMA
        run: python src/build_dashboard.py

      - name: Commit JMA and dashboard updates
        shell: bash
        run: |
          set -e

          if [ ! -f data/jma_typhoon.json ]; then
            echo "data/jma_typhoon.json was not created."
            exit 1
          fi

          if [ ! -f data/dashboard.json ]; then
            echo "data/dashboard.json was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jma_typhoon.json data/dashboard.json

          if git diff --cached --quiet; then
            echo "No JMA/dashboard data change. Nothing to commit."
            exit 0
          fi

          git commit -m "Update JMA typhoon and dashboard"

          # 다른 workflow가 먼저 push했을 때 충돌 방지
          git pull --rebase origin main
          git push origin main
