name: "📱 SBLC 모바일 메일 발송"

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "받는 메일주소 (비우면 기본 EMAIL_TO 사용)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  send-mobile-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build latest offline dashboard
        run: python src/build_offline_dashboard.py

      - name: Capture dashboard screenshot
        run: python src/capture_dashboard.py

      - name: Check generated files
        run: |
          test -f output/typhoon_dashboard_offline.html
          test -f output/typhoon_dashboard_capture.png
          ls -lh output/typhoon_dashboard_offline.html
          ls -lh output/typhoon_dashboard_capture.png

      - name: Select recipient
        env:
          INPUT_RECIPIENT: ${{ inputs.recipient }}
          DEFAULT_RECIPIENT: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$INPUT_RECIPIENT" ]; then
            echo "MAIL_TO=$INPUT_RECIPIENT" >> "$GITHUB_ENV"
            echo "Recipient: manual input"
          else
            echo "MAIL_TO=$DEFAULT_RECIPIENT" >> "$GITHUB_ENV"
            echo "Recipient: repository secret EMAIL_TO"
          fi

      - name: Send dashboard email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ env.MAIL_TO }}
        run: python src/send_dashboard_email.py
