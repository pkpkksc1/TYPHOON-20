name: CMA Typhoon Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch CMA typhoon data
        run: python src/fetch_cma_typhoon.py

      - name: Commit CMA data
        shell: bash
        run: |
          if [ ! -f data/cma_typhoon.json ]; then
            echo "data/cma_typhoon.json was not created."
            exit 1
          fi

          git add data/cma_typhoon.json

          if git diff --cached --quiet; then
            echo "No CMA data change. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CMA typhoon data"
          git push
